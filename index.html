<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Number to Khmer Words</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: 'Khmer OS', Arial, sans-serif;
      background-color: #f2f2f2;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    form {
      background: white;
      padding: 20px;
      margin: auto;
      width: 90%;
      max-width: 500px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }

    input[type="number"] {
      padding: 12px;
      width: 100%;
      font-size: 18px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    button {
      padding: 12px;
      font-size: 16px;
      width: 100%;
      box-sizing: border-box;
      cursor: pointer;
    }

    .result {
      margin-top: 20px;
      font-size: 20px;
      color: #333;
      word-wrap: break-word;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 22px;
      }

      .result {
        font-size: 18px;
      }

      button {
        font-size: 16px;
      }
    }
  </style>
</head>

<script src="convert.js"></script>
<script>
function convertNumber(e) {
  e.preventDefault();
  const number = document.getElementById("numberInput").value.trim();

  const khmerResult = numberToKhmerWords(number);
  const englishDivided = (Number(number) / 4000).toFixed(2); // Convert to dollars
  const englishResult = numberToEnglishWords(number); // You already have this in convert.js

  document.getElementById("khmerResult").innerText = `អក្សរខ្មែរ: ${khmerResult} រៀល`;
  document.getElementById("englishResult").innerText = `In English: ${englishResult} Riel`;
  document.getElementById("DollarResult").innerText = `Dollar: ${englishDivided}$`;
  document.getElementById("resultBox").style.display = 'block';

  const blob = new Blob([
    `លេខ: ${number}\n`,
    `អក្សរខ្មែរ: ${khmerResult} រៀល\n`,
    `In English: ${englishResult} Riel\n`,
    `Dollar: ${englishDivided} $`
  ], { type: 'text/plain;charset=utf-8' });

  const filename = `number_${number}.txt`;
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
</script>

<body>
  <h1>បំលែងលេខទៅជាអក្សរខ្មែរ</h1>

  <form onsubmit="convertNumber(event)">
    <input type="number" id="numberInput" placeholder="បញ្ចូលលេខ..." required />
    <button type="submit">បំលែង</button>
  </form>

  <div class="result" id="resultBox" style="display:none;">
    <strong>លទ្ធផល៖</strong><br>
    <span id="khmerResult"></span><br>
    <span id="englishResult"></span><br>
    <span id="DollarResult"></span>
    <table id="historyTable" style="width:100%;margin-top:20px;border-collapse:collapse;display:none;">
      <thead>
        <tr>
          <th style="border:1px solid #ccc;padding:8px;">លេខ</th>
          <th style="border:1px solid #ccc;padding:8px;">អក្សរខ្មែរ</th>
          <th style="border:1px solid #ccc;padding:8px;">English</th>
          <th style="border:1px solid #ccc;padding:8px;">Dollar</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
    <script>
      function addToHistory(number, khmer, english, dollar) {
        const table = document.getElementById('historyTable');
        const tbody = table.querySelector('tbody');
        const row = document.createElement('tr');
        row.innerHTML = `
          <td style="border:1px solid #ccc;padding:8px;">${number}</td>
          <td style="border:1px solid #ccc;padding:8px;">${khmer} រៀល</td>
          <td style="border:1px solid #ccc;padding:8px;">${english} Riel</td>
          <td style="border:1px solid #ccc;padding:8px;">${dollar}$</td>
        `;
        tbody.prepend(row);
        table.style.display = '';
      }

      const origConvertNumber = convertNumber;
      convertNumber = function(e) {
        origConvertNumber(e);
        const number = document.getElementById("numberInput").value.trim();
        const khmer = numberToKhmerWords(number);
        const english = numberToEnglishWords(number);
        const dollar = (Number(number) / 4000).toFixed(2);
        addToHistory(number, khmer, english, dollar);
      }
      window.addEventListener('DOMContentLoaded', function() {
        const form = document.querySelector('form');
        let clearBtn = document.createElement('button');
        clearBtn.type = 'button';
        clearBtn.textContent = 'Clear History';
        clearBtn.style.marginTop = '10px';
        clearBtn.style.width = form.offsetWidth + 'px';
        clearBtn.style.padding = '12px';
        clearBtn.style.fontSize = '16px';
        clearBtn.style.boxSizing = 'border-box';
        clearBtn.onclick = function() {
          const tbody = document.getElementById('historyTable').querySelector('tbody');
          tbody.innerHTML = '';
          document.getElementById('historyTable').style.display = 'none';
        };

        let wrapper = document.createElement('div');
        wrapper.style.width = '100%';
        wrapper.appendChild(clearBtn);
        form.parentNode.insertBefore(wrapper, form.nextSibling);

        window.addEventListener('resize', function() {
          clearBtn.style.width = form.offsetWidth + 'px';
        });
      });
    </script>
  </div>
</body>
</html>
